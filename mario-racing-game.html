<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mario Brothers Racing</title>
  <style>
    :root {
      --bg: #111827;
      --track: #1f2937;
      --lane-line: #374151;
      --finish: #facc15;
      --card: #0b1220;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --mario: #ef4444;
      --luigi: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1f2937, var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 1rem;
    }

    .game {
      width: min(920px, 96vw);
      background: linear-gradient(160deg, #111827, var(--card));
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 0.75rem;
      text-align: center;
      font-size: clamp(1.2rem, 2vw, 1.8rem);
    }

    p {
      margin: 0.25rem 0;
      color: var(--muted);
      text-align: center;
    }

    #track {
      margin-top: 1rem;
      width: 100%;
      border-radius: 12px;
      border: 1px solid #334155;
      background: var(--track);
      display: block;
    }

    .controls {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #475569;
      background: #1e293b;
      color: var(--text);
      border-radius: 10px;
      padding: 0.55rem 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.15); }

    #status {
      margin-top: 0.7rem;
      text-align: center;
      min-height: 1.35rem;
      font-weight: 600;
      color: #fef08a;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>🏁 Mario Brothers Racing</h1>
    <p>Tap <strong>A</strong> to move Mario and <strong>L</strong> to move Luigi.</p>
    <p>First to cross the finish line wins!</p>
    <canvas id="track" width="880" height="280" aria-label="Racing track"></canvas>

    <div class="controls">
      <button id="startBtn">Start Race</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div id="status">Press Start, then mash A and L!</div>
  </main>

  <script>
    const canvas = document.getElementById('track');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('status');

    const finishX = canvas.width - 90;
    const players = {
      mario: { x: 40, y: 85, color: '#ef4444', icon: '🍄', name: 'Mario', key: 'a' },
      luigi: { x: 40, y: 195, color: '#22c55e', icon: '🟢', name: 'Luigi', key: 'l' }
    };

    let raceStarted = false;
    let winner = null;

    function drawTrack() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background lanes
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#374151';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();

      // Finish line
      ctx.fillStyle = '#facc15';
      ctx.fillRect(finishX, 0, 8, canvas.height);
      for (let y = 0; y < canvas.height; y += 24) {
        ctx.fillStyle = y % 48 === 0 ? '#111827' : '#f8fafc';
        ctx.fillRect(finishX + 8, y, 20, 24);
      }

      drawPlayer(players.mario);
      drawPlayer(players.luigi);
    }

    function drawPlayer(player) {
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.roundRect(player.x, player.y - 24, 72, 36, 10);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '22px sans-serif';
      ctx.fillText(player.icon, player.x + 8, player.y);

      ctx.font = '700 14px sans-serif';
      ctx.fillText(player.name, player.x + 34, player.y - 2);
    }

    function resetRace() {
      players.mario.x = 40;
      players.luigi.x = 40;
      raceStarted = false;
      winner = null;
      statusEl.textContent = 'Press Start, then mash A and L!';
      drawTrack();
    }

    function startRace() {
      if (winner) {
        resetRace();
      }
      raceStarted = true;
      statusEl.textContent = 'Go! A for Mario, L for Luigi!';
    }

    function handleMove(key) {
      if (!raceStarted || winner) return;

      const lower = key.toLowerCase();
      for (const player of Object.values(players)) {
        if (player.key === lower) {
          player.x += Math.floor(Math.random() * 15) + 8;
          if (player.x + 72 >= finishX) {
            winner = player.name;
            statusEl.textContent = `🏆 ${winner} wins the race!`;
            raceStarted = false;
          }
        }
      }
      drawTrack();
    }

    startBtn.addEventListener('click', startRace);
    resetBtn.addEventListener('click', resetRace);
    window.addEventListener('keydown', (event) => handleMove(event.key));

    drawTrack();
  </script>
</body>
</html>
